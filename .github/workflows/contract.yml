name: SDK Contract Check

on:
  pull_request:
    # Trunk -> main promotion PR only, and only on purpose: CI runs when the
    # `ci:run` label is added (by the merge train, or an agent once the PR is
    # ready). Opened, reopened and synchronize run nothing; any other label
    # skips every job.
    types: [labeled]
    branches:
      - main

concurrency:
  # PR runs collapse per pull request; push runs key off the commit sha so two
  # merges landing together cannot cancel each other. A `labeled` event for any
  # label other than `ci:run` runs nothing, so it gets its own throwaway group:
  # it must never cancel the PR's in-progress run.
  group: contract-${{ github.event_name != 'pull_request' && format('push-{0}', github.sha) || ((github.event.action == 'labeled' && github.event.label.name != 'ci:run') && format('ignored-{0}', github.run_id) || format('pr-{0}', github.event.pull_request.number)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'ci:run')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-contract-surface.sh
