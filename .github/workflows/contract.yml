name: SDK Contract Check

on:
  pull_request:
    branches:
      - main

jobs:
  contract:
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.head_ref == 'trunk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-contract-surface.sh
